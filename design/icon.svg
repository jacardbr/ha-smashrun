<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Original icon for the integration, inspired by Smashrun's running-figure
       mark: a runner in full stride, leaning forward, with a motion trail.
       Home Assistant colours: blue #41BDF5 -> #0288D1, white glyph. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41BDF5"/>
      <stop offset="1" stop-color="#0288D1"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- motion trail -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="12">
    <path d="M26 104 H64" stroke-opacity=".85"/>
    <path d="M18 132 H50" stroke-opacity=".6"/>
    <path d="M30 160 H54" stroke-opacity=".35"/>
  </g>

  <!-- runner -->
  <circle cx="184" cy="64" r="21" fill="#fff"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- torso -->
    <path d="M160 100 L128 146" stroke-width="30"/>
    <!-- arms -->
    <path d="M158 106 L190 126 L214 102" stroke-width="18"/>
    <path d="M154 108 L120 116 L98 140" stroke-width="18"/>
    <!-- front leg: knee driven up -->
    <path d="M128 146 L176 162 L166 208" stroke-width="22"/>
    <!-- back leg: pushing off -->
    <path d="M128 146 L104 184 L58 202" stroke-width="22"/>
  </g>
</svg>
